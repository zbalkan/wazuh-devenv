name: Wazuh provisioning integration

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      wazuh_version:
        description: Wazuh Manager version to provision
        required: true
        default: "4.14.7"
        type: string

permissions:
  contents: read

env:
  WAZUHTESTER_SPEC: "wazuhtester==0.1.0rc1"
  WAZUH_VERSION: ${{ inputs.wazuh_version || '4.14.7' }}

jobs:
  ubuntu-full-install:
    name: Ubuntu full install
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure temporary paths
        run: |
          echo "WAZUHDEVENV_HOME=$RUNNER_TEMP/wazuhdevenv-state" >> "$GITHUB_ENV"
          echo "WORKSPACE=$RUNNER_TEMP/wazuh-workspace" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install wazuhdevenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: First init
        run: |
          wazuhdevenv init "$WORKSPACE" --wazuh-version "$WAZUH_VERSION" --skip-corpus

      - name: Verify provisioned environment
        run: |
          sudo systemctl is-active --quiet wazuh-manager
          sudo test -S /var/ossec/queue/sockets/logtest
          test -f "$WORKSPACE/.venv/pyvenv.cfg"
          test -d "$WORKSPACE/rules"
          test -d "$WORKSPACE/decoders"
          test "$(stat -c %U "$WORKSPACE/rules")" = "$USER"
          test "$(stat -c %G "$WORKSPACE/rules")" = "wazuh"
          test "$(stat -c %U "$WORKSPACE/decoders")" = "$USER"
          test "$(stat -c %G "$WORKSPACE/decoders")" = "wazuh"
          groups="$(id -nG "$USER")"
          grep -Eq '(^| )wazuh( |$)' <<<"$groups"
          test -f "$WAZUHDEVENV_HOME/state.json"
          sudo mountpoint -q /var/ossec/etc/rules
          sudo mountpoint -q /var/ossec/etc/decoders
          "$WORKSPACE/.venv/bin/python" -c "import importlib.metadata as m; v=m.version('wazuhtester'); assert v == '0.1.0rc1', v; print(v)"

      - name: Second init must fail fast
        run: |
          set +e
          output="$(wazuhdevenv init "$WORKSPACE" --wazuh-version "$WAZUH_VERSION" --skip-corpus 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq "already initialized" <<<"$output"
          grep -Fq "$WORKSPACE" <<<"$output"
          grep -Fq "$WAZUHDEVENV_HOME/state.json" <<<"$output"

      - name: Verify environment after rejected second init
        run: |
          sudo systemctl is-active --quiet wazuh-manager
          sudo test -S /var/ossec/queue/sockets/logtest
          sudo mountpoint -q /var/ossec/etc/rules
          sudo mountpoint -q /var/ossec/etc/decoders

      - name: Uninstall environment
        run: |
          printf '%s\n' '<group name="preserved"></group>' > "$WORKSPACE/rules/preserved.xml"
          output="$(wazuhdevenv uninstall)"
          printf '%s\n' "$output"
          grep -Fq "Removed:" <<<"$output"
          grep -Fq "Restored:" <<<"$output"
          grep -Fq "Preserved:" <<<"$output"
          grep -Fq "Remnants:" <<<"$output"
          grep -Fq "wazuhdevenv Python/pipx installation itself is not self-removed" <<<"$output"

      - name: Verify uninstall cleanup
        run: |
          ! dpkg-query -W -f='${Status}\n' wazuh-manager 2>/dev/null | grep -Fq 'install ok installed'
          test ! -e /var/ossec
          test ! -e "$WAZUHDEVENV_HOME"
          test ! -e "$WORKSPACE/.venv"
          test -f "$WORKSPACE/rules/preserved.xml"
          test -d "$WORKSPACE/decoders"
          ! grep -Fq "$WORKSPACE/rules /var/ossec/etc/rules none bind 0 0" /etc/fstab
          ! grep -Fq "$WORKSPACE/decoders /var/ossec/etc/decoders none bind 0 0" /etc/fstab
          test ! -e /etc/apt/sources.list.d/wazuh.list
          test ! -e /usr/share/keyrings/wazuh.gpg
          groups="$(id -nG "$USER")"
          ! grep -Eq '(^| )wazuh( |$)' <<<"$groups"

      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status wazuh-manager --no-pager || true
          sudo journalctl -u wazuh-manager --no-pager -n 150 || true
          sudo findmnt /var/ossec/etc/rules || true
          sudo findmnt /var/ossec/etc/decoders || true
          cat "$WAZUHDEVENV_HOME/state.json" || true

  rocky-full-install:
    name: Rocky Linux 10 full install
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Rocky Linux systemd container
        run: |
          docker run --detach             --name wazuh-rocky             --privileged             --cgroupns=host             --env container=docker             --tmpfs /run             --tmpfs /run/lock             --volume /sys/fs/cgroup:/sys/fs/cgroup:rw             --volume "$GITHUB_WORKSPACE:/checkout:ro"             rockylinux/rockylinux:10-ubi-init             /sbin/init

          for _ in {1..30}; do
            state="$(docker exec wazuh-rocky systemctl is-system-running 2>/dev/null || true)"
            if [[ "$state" == "running" || "$state" == "degraded" ]]; then
              break
            fi
            sleep 1
          done

          docker exec wazuh-rocky systemctl daemon-reload

      - name: Prepare Rocky Linux developer
        run: |
          docker exec wazuh-rocky dnf -y install python3 python3-pip sudo shadow-utils
          docker exec wazuh-rocky useradd --create-home --shell /bin/bash developer
          docker exec wazuh-rocky bash -c             'printf "%s\n" "developer ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/developer && chmod 0440 /etc/sudoers.d/developer'

          # RHEL-family pam_unix account checks can fail inside containers on
          # Ubuntu hosts even for valid local users. PAM itself is not under
          # test here; sudoers authorization and wazuhdevenv's sudo boundary are.
          docker exec wazuh-rocky bash -c             'printf "%s\n" "#%PAM-1.0" "auth sufficient pam_permit.so" "account sufficient pam_permit.so" "session sufficient pam_permit.so" > /etc/pam.d/sudo'

          docker exec wazuh-rocky cp -a /checkout /home/developer/wazuhdevenv
          docker exec wazuh-rocky chown -R developer:developer /home/developer/wazuhdevenv
          docker exec --user developer wazuh-rocky sudo -n true

      - name: Install wazuhdevenv
        run: |
          docker exec             --user developer             --env HOME=/home/developer             --workdir /home/developer/wazuhdevenv             wazuh-rocky             python3 -m venv /home/developer/ci-venv

          docker exec             --user developer             --env HOME=/home/developer             wazuh-rocky             /home/developer/ci-venv/bin/python -m pip install --upgrade pip

          docker exec             --user developer             --env HOME=/home/developer             --workdir /home/developer/wazuhdevenv             wazuh-rocky             /home/developer/ci-venv/bin/python -m pip install -e .

      - name: First init
        run: |
          docker exec             --user developer             --env HOME=/home/developer             --env WAZUHDEVENV_HOME=/home/developer/wazuhdevenv-state             --env WAZUHTESTER_SPEC="$WAZUHTESTER_SPEC"             --workdir /home/developer/wazuhdevenv             wazuh-rocky             /home/developer/ci-venv/bin/wazuhdevenv             init /home/developer/wazuh-workspace             --wazuh-version "$WAZUH_VERSION"             --skip-corpus

      - name: Verify provisioned environment
        run: |
          docker exec wazuh-rocky systemctl is-active --quiet wazuh-manager
          docker exec wazuh-rocky test -S /var/ossec/queue/sockets/logtest
          docker exec wazuh-rocky test -f /home/developer/wazuh-workspace/.venv/pyvenv.cfg
          docker exec wazuh-rocky test -d /home/developer/wazuh-workspace/rules
          docker exec wazuh-rocky test -d /home/developer/wazuh-workspace/decoders
          test "$(docker exec wazuh-rocky stat -c %U /home/developer/wazuh-workspace/rules)" = "developer"
          test "$(docker exec wazuh-rocky stat -c %G /home/developer/wazuh-workspace/rules)" = "wazuh"
          test "$(docker exec wazuh-rocky stat -c %U /home/developer/wazuh-workspace/decoders)" = "developer"
          test "$(docker exec wazuh-rocky stat -c %G /home/developer/wazuh-workspace/decoders)" = "wazuh"
          groups="$(docker exec wazuh-rocky id -nG developer)"
          tr ' ' '\n' <<<"$groups" | grep -Fxq wazuh
          docker exec wazuh-rocky test -f /home/developer/wazuhdevenv-state/state.json
          docker exec wazuh-rocky mountpoint -q /var/ossec/etc/rules
          docker exec wazuh-rocky mountpoint -q /var/ossec/etc/decoders
          docker exec             --user developer             wazuh-rocky             /home/developer/wazuh-workspace/.venv/bin/python             -c "import importlib.metadata as m; v=m.version('wazuhtester'); assert v == '0.1.0rc1', v; print(v)"

      - name: Second init must fail fast
        run: |
          set +e
          output="$(
            docker exec               --user developer               --env HOME=/home/developer               --env WAZUHDEVENV_HOME=/home/developer/wazuhdevenv-state               --env WAZUHTESTER_SPEC="$WAZUHTESTER_SPEC"               --workdir /home/developer/wazuhdevenv               wazuh-rocky               /home/developer/ci-venv/bin/wazuhdevenv               init /home/developer/wazuh-workspace               --wazuh-version "$WAZUH_VERSION"               --skip-corpus 2>&1
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq "already initialized" <<<"$output"
          grep -Fq "/home/developer/wazuh-workspace" <<<"$output"
          grep -Fq "/home/developer/wazuhdevenv-state/state.json" <<<"$output"

      - name: Verify environment after rejected second init
        run: |
          docker exec wazuh-rocky systemctl is-active --quiet wazuh-manager
          docker exec wazuh-rocky test -S /var/ossec/queue/sockets/logtest
          docker exec wazuh-rocky mountpoint -q /var/ossec/etc/rules
          docker exec wazuh-rocky mountpoint -q /var/ossec/etc/decoders

      - name: Uninstall environment
        run: |
          docker exec wazuh-rocky bash -c 'printf "%s\n" "<group name=\"preserved\"></group>" > /home/developer/wazuh-workspace/rules/preserved.xml'
          output="$(
            docker exec             --user developer             --env HOME=/home/developer             --env WAZUHDEVENV_HOME=/home/developer/wazuhdevenv-state             --workdir /home/developer/wazuhdevenv             wazuh-rocky             /home/developer/ci-venv/bin/wazuhdevenv uninstall
          )"
          printf '%s\n' "$output"
          grep -Fq "Removed:" <<<"$output"
          grep -Fq "Restored:" <<<"$output"
          grep -Fq "Preserved:" <<<"$output"
          grep -Fq "Remnants:" <<<"$output"
          grep -Fq "wazuhdevenv Python/pipx installation itself is not self-removed" <<<"$output"

      - name: Verify uninstall cleanup
        run: |
          ! docker exec wazuh-rocky rpm -q wazuh-manager
          docker exec wazuh-rocky test ! -e /var/ossec
          docker exec wazuh-rocky test ! -e /home/developer/wazuhdevenv-state
          docker exec wazuh-rocky test ! -e /home/developer/wazuh-workspace/.venv
          docker exec wazuh-rocky test -f /home/developer/wazuh-workspace/rules/preserved.xml
          docker exec wazuh-rocky test -d /home/developer/wazuh-workspace/decoders
          ! docker exec wazuh-rocky grep -Fq '/home/developer/wazuh-workspace/rules /var/ossec/etc/rules none bind 0 0' /etc/fstab
          ! docker exec wazuh-rocky grep -Fq '/home/developer/wazuh-workspace/decoders /var/ossec/etc/decoders none bind 0 0' /etc/fstab
          docker exec wazuh-rocky test ! -e /etc/yum.repos.d/wazuh.repo
          groups="$(docker exec wazuh-rocky id -nG developer)"
          ! tr ' ' '\n' <<<"$groups" | grep -Fxq wazuh

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker exec wazuh-rocky systemctl status wazuh-manager --no-pager || true
          docker exec wazuh-rocky journalctl -u wazuh-manager --no-pager -n 150 || true
          docker exec wazuh-rocky findmnt /var/ossec/etc/rules || true
          docker exec wazuh-rocky findmnt /var/ossec/etc/decoders || true
          docker exec wazuh-rocky cat /home/developer/wazuhdevenv-state/state.json || true

      - name: Remove Rocky Linux container
        if: always()
        run: docker rm --force wazuh-rocky || true
